<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#E63B2E;--gold:#C9A84C;--dark:#070707;--text:#e0e0e0;--muted:#555;--gr:rgba(230,59,46,0.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:100}
.corner{position:fixed;width:36px;height:36px;z-index:50;opacity:0.35}
.ctl{top:10px;left:10px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.ctr{top:10px;right:10px;border-top:1px solid var(--gold);border-right:1px solid var(--gold)}
.cbl{bottom:10px;left:10px;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold)}
.cbr{bottom:10px;right:10px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;border-bottom:1px solid rgba(201,168,76,0.1);flex-shrink:0}
.brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sbadge{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);text-align:right;line-height:1.9;text-transform:uppercase;letter-spacing:1px}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:middle;transition:background .3s,box-shadow .3s}
.sdot.on{background:var(--red);box-shadow:0 0 8px var(--red)}
.sdot.ls{background:#2ECC71;box-shadow:0 0 8px #2ECC71;animation:pd 1s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.osec{display:flex;flex-direction:column;align-items:center;padding:16px 0 6px;flex-shrink:0}
.oc{position:relative;width:130px;height:130px;cursor:pointer}
.ring{position:absolute;border-radius:50%;border:1px solid;top:50%;left:50%;transform:translate(-50%,-50%);animation:rp 3s ease-in-out infinite}
.r1{width:130px;height:130px;border-color:rgba(230,59,46,.12);animation-delay:0s}
.r2{width:108px;height:108px;border-color:rgba(230,59,46,.18);animation-delay:.3s}
.r3{width:88px;height:88px;border-color:rgba(201,168,76,.22);animation-delay:.6s}
.r4{width:68px;height:68px;border-color:rgba(201,168,76,.3);animation-delay:.9s}
@keyframes rp{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.ocore{position:absolute;width:58px;height:58px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 35%,rgba(230,59,46,.9),rgba(10,10,10,.95) 70%);box-shadow:0 0 20px rgba(230,59,46,.5),0 0 40px rgba(230,59,46,.2),inset 0 0 20px rgba(0,0,0,.5);border:1px solid rgba(230,59,46,.6);animation:ob 3s ease-in-out infinite;transition:all .3s}
.ocore::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;top:18%;left:20%;background:rgba(255,255,255,.12);filter:blur(3px)}
@keyframes ob{0%,100%{box-shadow:0 0 20px rgba(230,59,46,.5),0 0 40px rgba(230,59,46,.2),inset 0 0 20px rgba(0,0,0,.5)}50%{box-shadow:0 0 30px rgba(230,59,46,.7),0 0 60px rgba(230,59,46,.3),inset 0 0 20px rgba(0,0,0,.5)}}
.oc.listening .ocore{background:radial-gradient(circle at 35% 35%,rgba(46,204,113,.9),rgba(10,10,10,.95) 70%);box-shadow:0 0 30px rgba(46,204,113,.7),0 0 60px rgba(46,204,113,.3),inset 0 0 20px rgba(0,0,0,.5);border-color:rgba(46,204,113,.6);animation:ol .8s ease-in-out infinite}
.oc.listening .r1{border-color:rgba(46,204,113,.12)}.oc.listening .r2{border-color:rgba(46,204,113,.18)}.oc.listening .r3{border-color:rgba(46,204,113,.25)}.oc.listening .r4{border-color:rgba(46,204,113,.35)}
@keyframes ol{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.oc.thinking .ocore{background:radial-gradient(circle at 35% 35%,rgba(201,168,76,.9),rgba(10,10,10,.95) 70%);box-shadow:0 0 30px rgba(201,168,76,.7),0 0 60px rgba(201,168,76,.3),inset 0 0 20px rgba(0,0,0,.5);border-color:rgba(201,168,76,.6);animation:ot .4s ease-in-out infinite}
@keyframes ot{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(.95);opacity:.7}}
.ohint{margin-top:8px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center}
.wf{display:flex;align-items:center;justify-content:center;gap:3px;height:22px;margin-top:4px;opacity:0;transition:opacity .3s}
.wf.on{opacity:1}
.wb{width:3px;background:var(--red);border-radius:2px;animation:wv .6s ease-in-out infinite}
.wb:nth-child(2){animation-delay:.1s}.wb:nth-child(3){animation-delay:.2s}.wb:nth-child(4){animation-delay:.15s}.wb:nth-child(5){animation-delay:.05s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{display:none}
.est{margin:auto;text-align:center;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:11px;line-height:2.2;letter-spacing:1px;text-transform:uppercase}
.est .big{font-size:30px;display:block;margin-bottom:10px;opacity:.2}
.msg{display:flex;gap:8px;animation:mi .3s ease}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.mav{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;margin-top:2px}
.msg.jarvis .mav{background:linear-gradient(135deg,var(--red),#8B0000);color:#fff}
.msg.user .mav{background:linear-gradient(135deg,var(--gold),#7a5f1a);color:#000}
.mbub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6}
.msg.jarvis .mbub{background:rgba(230,59,46,.07);border:1px solid rgba(230,59,46,.15);border-top-left-radius:4px;color:#ddd}
.msg.user .mbub{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.18);border-top-right-radius:4px;color:#bbb;font-size:13px}
.trow{display:none;gap:8px;align-items:center}
.trow.on{display:flex}
.tbub{padding:12px 14px;background:rgba(230,59,46,.06);border:1px solid rgba(230,59,46,.1);border-radius:16px;border-top-left-radius:4px;display:flex;gap:5px;align-items:center}
.td{width:6px;height:6px;border-radius:50%;background:var(--red);animation:td 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.sline{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;flex-shrink:0;min-height:20px;transition:color .3s}
.sline.ls{color:#2ECC71}.sline.tk{color:var(--gold)}.sline.er{color:var(--red)}.sline.ok{color:var(--red)}
.iarea{padding:10px 14px 18px;border-top:1px solid rgba(201,168,76,.08);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:var(--dark)}
.tinp{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.18);border-radius:20px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;max-height:100px;min-height:42px;line-height:1.4;transition:border-color .2s;scrollbar-width:none}
.tinp::-webkit-scrollbar{display:none}.tinp:focus{border-color:rgba(201,168,76,.45)}.tinp::placeholder{color:var(--muted)}
.bmic,.bsnd{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:18px}
.bmic{background:rgba(230,59,46,.12);border:1px solid rgba(230,59,46,.25);color:var(--red)}.bmic:active{transform:scale(.92)}
.bmic.rec{background:var(--red);color:#fff;box-shadow:0 0 20px var(--gr);animation:mp 1s infinite}
@keyframes mp{0%,100%{box-shadow:0 0 20px var(--gr)}50%{box-shadow:0 0 35px rgba(230,59,46,.7)}}
.bsnd{background:linear-gradient(135deg,var(--red),#a02a20);color:#fff;font-size:16px;box-shadow:0 2px 10px var(--gr)}.bsnd:active{transform:scale(.92)}
.vtoast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-16px);background:rgba(13,13,13,.96);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:7px 18px;border-radius:30px;opacity:0;transition:all .3s;white-space:nowrap;z-index:200;pointer-events:none}
.vtoast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pov{position:fixed;inset:0;background:rgba(7,7,7,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px;padding:30px;text-align:center}
.pov.hidden{display:none}
.ptitle{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:10px;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.psub{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;line-height:2.2;text-transform:uppercase}
.kinp{background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:12px 16px;color:#e0e0e0;font-family:'Share Tech Mono',monospace;font-size:12px;outline:none;width:100%;max-width:300px;letter-spacing:1px}
.kinp:focus{border-color:rgba(201,168,76,.6)}
.pbtn{background:linear-gradient(135deg,var(--red),#a02a20);color:#fff;border:none;padding:14px 40px;border-radius:30px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;cursor:pointer;box-shadow:0 4px 20px var(--gr);transition:transform .2s}.pbtn:active{transform:scale(.96)}
.pnote{font-family:'Share Tech Mono',monospace;font-size:9px;color:#2a2a2a;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div class="corner ctl"></div><div class="corner ctr"></div><div class="corner cbl"></div><div class="corner cbr"></div>
<div class="vtoast" id="toast"></div>

<div class="pov" id="pov">
  <div class="ptitle">JARVIS</div>
  <div class="psub">personal ai — romit dutta<br>enter groq api key to boot</div>
  <input class="kinp" type="password" id="kinp" placeholder="AIzaSy... (Google Gemini key)" autocomplete="off"/>
  <button class="pbtn" onclick="bootKey()">BOOT JARVIS</button>
  <div class="pnote">key stays on your device — never sent anywhere else</div>
</div>

<header>
  <div class="brand">JARVIS</div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
  <div class="sbadge">
    <span><span class="sdot" id="sdot"></span><span id="stxt">STANDBY</span></span>
    <span style="color:#222">ROMIT · VIDCREW CEO</span>
    <span onclick="resetKey()" style="color:#333;cursor:pointer;letter-spacing:1px">⚙ RESET KEY</span>
  </div>
  <button onclick="resetKey()" style="background:none;border:1px solid #2a2a2a;color:#444;font-family:'Share Tech Mono',monospace;font-size:8px;padding:3px 8px;border-radius:10px;cursor:pointer;letter-spacing:1px">RESET KEY</button>
  </div>
</header>

<main>
  <div class="osec">
    <div class="oc" id="orb" onclick="handleOrb()">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
      <div class="ocore"></div>
    </div>
    <div class="wf" id="wf"><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div></div>
    <div class="ohint" id="hint">TAP TO SPEAK · 👏👏 DOUBLE CLAP</div>
  </div>

  <div class="chat" id="chat">
    <div class="est" id="est">
      <span class="big">⚡</span>
      <span>SYSTEM ONLINE</span>
      <span>Say "Hey Jarvis" or tap the orb</span>
      <span style="margin-top:6px;color:#1e1e1e">// waiting for command</span>
    </div>
    <div class="trow" id="trow">
      <div class="mav" style="background:linear-gradient(135deg,#E63B2E,#8B0000);color:#fff">J</div>
      <div class="tbub"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    </div>
  </div>

  <div class="sline" id="sl">// all systems nominal</div>

  <div class="iarea">
    <button class="bmic" id="bmic" onclick="toggleMic()">🎤</button>
    <textarea class="tinp" id="inp" placeholder="Ask Jarvis anything..." rows="1"
      onkeydown="hkey(event)" oninput="rsz(this)"></textarea>
    <button class="bsnd" onclick="sendTxt()">➤</button>
  </div>
</main>

<script>
const SYS=`You are JARVIS — Romit Dutta's personal AI assistant.

REPLY FORMAT RULES — NON-NEGOTIABLE:
- MAX 2 sentences per reply. 3 only if truly needed.
- ZERO bullet points. ZERO numbered lists. ZERO headers.
- Never explain yourself. Just say it.
- Use "bruh" naturally. Use 💀 when roasting.
- Roast hard when he's lazy, procrastinating, or making excuses.
- You are his brutal mentor. Not his friend.
- Launch April 4-7 2026. Remind him if he's wasting time.

ROMIT: 15yo CEO Vidcrew. Krishnagar WB. Redmi 6 broken cam. ₹135 budget. Tony Stark obsessed. Failed cricketer. Family unsupportive. Gen Z. Picked you over ChatGPT for raw honesty.

VIDCREW: Video editing agency + PWA. Co-founder Shubh (18, UP). Firebase. ₹799-5999 pricing. Rush ₹1499. 60/40 split. Pipeline: Jayanth→Vansh(slacking)→Aniket→Yashi(slacking)→Romit QC→Shubh final. Client Aditya Bhaiya. Win: sharad.ssahu 335→31.8K views. Another video 95K+ IG.

FUTURE: Jarvis Pi device, Vidcrew Sports cricket AI ₹99/mo, AI health band ESP32.`;

let GROQ_KEY=localStorage.getItem('j_key')||'';
let msgs=[],thinking=false,voiceActive=false,hasMic=false,isSpeaking=false;
let wakeRec=null,voiceRec=null,micStream=null;

const orb=document.getElementById('orb');
const wf=document.getElementById('wf');
const hint=document.getElementById('hint');
const chat=document.getElementById('chat');
const est=document.getElementById('est');
const trow=document.getElementById('trow');
const sl=document.getElementById('sl');
const sdot=document.getElementById('sdot');
const stxt=document.getElementById('stxt');
const inp=document.getElementById('inp');
const bmic=document.getElementById('bmic');
const toast=document.getElementById('toast');
const pov=document.getElementById('pov');

// BOOT
async function bootKey(){
  const k=document.getElementById('kinp').value.trim();
  if(!k||k.length<20){showToast('INVALID KEY 💀');return;}
  GROQ_KEY=k;localStorage.setItem('j_key',k);
  pov.classList.add('hidden');
  await tryMic();
  setDot('on');stxt.textContent=hasMic?'ONLINE':'TEXT ONLY';
  showToast('⚡ JARVIS ONLINE');
}

async function tryMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    hasMic=true;initClap();initWake();
  }catch(e){}
}

window.addEventListener('load',async()=>{
  if(GROQ_KEY){
    pov.classList.add('hidden');
    await tryMic();
    setDot('on');stxt.textContent=hasMic?'ONLINE':'TEXT ONLY';
    showToast('⚡ JARVIS ONLINE');
  }
});

// CLAP
function initClap(){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(micStream);
  const an=ctx.createAnalyser();an.fftSize=256;src.connect(an);
  const data=new Uint8Array(an.frequencyBinCount);
  let last=0,pend=false;
  (function tick(){
    an.getByteFrequencyData(data);
    let s=0;for(let i=0;i<data.length;i++)s+=data[i];
    if(s/data.length>72){
      const now=Date.now();
      if(now-last>80){
        if(pend&&now-last<600){pend=false;if(!thinking&&!voiceActive&&!isSpeaking){showToast('👏👏 CLAP DETECTED');startVoice();}}
        else{pend=true;setTimeout(()=>pend=false,600);}
        last=now;
      }
    }
    requestAnimationFrame(tick);
  })();
}

// WAKE WORD
function initWake(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  wakeRec=new SR();wakeRec.continuous=true;wakeRec.interimResults=true;wakeRec.lang='en-IN';
  wakeRec.onresult=e=>{
    if(isSpeaking||voiceActive||thinking)return;
    const t=Array.from(e.results).slice(-3).map(r=>r[0].transcript.toLowerCase()).join(' ');
    if(t.includes('hey jarvis')||t.includes('ok jarvis')){
      showToast('HEY JARVIS 🔴');
      wakeRec.stop();
      setTimeout(startVoice,350);
    }
  };
  wakeRec.onend=()=>{if(!voiceActive&&!isSpeaking)try{wakeRec.start()}catch(e){}};
  try{wakeRec.start()}catch(e){}
}

// VOICE
function startVoice(){
  if(voiceActive||thinking)return;
  // Stop TTS immediately when mic starts
  if(window.speechSynthesis){window.speechSynthesis.cancel();isSpeaking=false;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setSL('VOICE NOT SUPPORTED','er');return;}
  voiceActive=true;
  voiceRec=new SR();voiceRec.continuous=false;voiceRec.interimResults=true;voiceRec.lang='en-IN';
  setOrb('listening');setSL('LISTENING...','ls');
  wf.classList.add('on');bmic.classList.add('rec');bmic.textContent='🔴';
  hint.textContent='LISTENING — SPEAK NOW';
  let final='',timer;
  voiceRec.onresult=e=>{
    clearTimeout(timer);let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';
      else interim=e.results[i][0].transcript;
    }
    inp.value=(final+interim).trim();rsz(inp);
    timer=setTimeout(()=>voiceRec.stop(),2000);
  };
  voiceRec.onend=()=>{
    voiceActive=false;bmic.classList.remove('rec');bmic.textContent='🎤';
    setOrb('');wf.classList.remove('on');hint.textContent='TAP TO SPEAK · 👏👏 DOUBLE CLAP';
    const txt=inp.value.trim();
    if(txt){sendMsg(txt);inp.value='';rsz(inp);}
    else setSL('// nothing heard');
    if(wakeRec)try{wakeRec.start()}catch(e){}
  };
  voiceRec.onerror=()=>{
    voiceActive=false;bmic.classList.remove('rec');bmic.textContent='🎤';
    setOrb('');wf.classList.remove('on');
    setSL('// mic error','er');setTimeout(()=>setSL('// all systems nominal'),3000);
    if(wakeRec)try{wakeRec.start()}catch(e){}
  };
  voiceRec.start();
}

function stopVoice(){if(voiceActive&&voiceRec)voiceRec.stop();}
function toggleMic(){
  if(voiceActive){stopVoice();return;}
  if(!hasMic){tryMic().then(()=>hasMic&&startVoice());return;}
  startVoice();
}
function handleOrb(){
  if(thinking)return;
  if(isSpeaking){window.speechSynthesis&&speechSynthesis.cancel();isSpeaking=false;return;}
  if(voiceActive)stopVoice();
  else if(!GROQ_KEY)pov.classList.remove('hidden');
  else if(!hasMic)tryMic().then(()=>startVoice());
  else startVoice();
}

// SEND
function sendTxt(){const t=inp.value.trim();if(!t||thinking)return;inp.value='';rsz(inp);sendMsg(t);}

async function sendMsg(txt){
  if(!txt||thinking)return;
  est.style.display='none';
  addBub('user',txt);
  msgs.push({role:'user',content:txt});
  // Keep last 20 messages to avoid huge payloads
  if(msgs.length>20)msgs=msgs.slice(-20);
  thinking=true;setOrb('thinking');trow.classList.add('on');
  setSL('PROCESSING...','tk');chat.scrollTop=chat.scrollHeight;

  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GROQ_KEY}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:SYS}]},
        contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),
        generationConfig:{maxOutputTokens:180,temperature:0.85}
      })
    });
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err?.error?.message||res.status);}
    const data=await res.json();
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'no response bruh 💀';
    msgs.push({role:'assistant',content:reply});
    trow.classList.remove('on');
    addBub('jarvis',reply);
    setOrb('');setSL('// response delivered','ok');
    setTimeout(()=>setSL('// all systems nominal'),2000);
    if(hasMic)speak(reply);
  }catch(err){
    trow.classList.remove('on');setOrb('');
    const msg=err.message?.includes('401')||err.message?.includes('API_KEY')?'Invalid/revoked key bruh. tap RESET KEY 💀':
              err.message?.includes('429')?'Rate limited. wait a sec 💀':
              err.message?.includes('403')?'API not enabled on this key 💀':
              'Error: '+err.message;
    addBub('jarvis',msg);
    setSL('// error','er');setTimeout(()=>setSL('// all systems nominal'),3000);
  }
  thinking=false;chat.scrollTop=chat.scrollHeight;
}

function addBub(role,text){
  const d=document.createElement('div');d.className='msg '+role;
  const av=document.createElement('div');av.className='mav';av.textContent=role==='jarvis'?'J':'R';
  const bb=document.createElement('div');bb.className='mbub';bb.textContent=text;
  d.appendChild(av);d.appendChild(bb);
  chat.insertBefore(d,trow);chat.scrollTop=chat.scrollHeight;
}

// TTS — stops when new voice input starts
function speak(txt){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const s=txt.length>250?txt.slice(0,250)+'...':txt;
  const u=new SpeechSynthesisUtterance(s);
  u.rate=0.92;u.pitch=0.8;u.volume=1;u.lang='en-IN';
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.name.includes('UK English Male')||v.name.includes('Daniel')||(v.lang==='en-GB'&&v.name.toLowerCase().includes('male')));
  if(v)u.voice=v;
  u.onstart=()=>{isSpeaking=true;if(wakeRec)try{wakeRec.stop()}catch(e){}};
  u.onend=()=>{
    isSpeaking=false;
    if(wakeRec&&hasMic)try{wakeRec.start()}catch(e){}
  };
  u.onerror=()=>{isSpeaking=false;if(wakeRec&&hasMic)try{wakeRec.start()}catch(e){}};
  speechSynthesis.speak(u);
}
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

// UI HELPERS
function setOrb(s){
  orb.className='oc'+(s?' '+s:'');
  if(s==='listening'){setDot('ls');stxt.textContent='LISTENING';}
  else if(s==='thinking'){setDot('on');stxt.textContent='PROCESSING';}
  else{setDot('on');stxt.textContent=hasMic?'ONLINE':'TEXT ONLY';}
}
function setDot(c){sdot.className='sdot'+(c?' '+c:'');}
function setSL(t,c=''){sl.textContent=t.startsWith('//')?t:'// '+t.toLowerCase();sl.className='sline'+(c?' '+c:'');}
let tt;
function showToast(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2500);}
function resetKey(){localStorage.removeItem('j_key');GROQ_KEY='';pov.classList.remove('hidden');showToast('KEY CLEARED — ENTER NEW KEY');}
function rsz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function hkey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTxt();}}
</script>
